# DevReport Configuration
spring.application.name=devreport

# UTF-8 Encoding
spring.thymeleaf.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# GitHub Configuration - All values from environment variables
github.token=${GITHUB_TOKEN}
github.owner=${GITHUB_OWNER:IA-para-DEVs-SCTEC-T2}
github.repository=${GITHUB_REPO:mini-projeto-modulo2-devreport}
github.project=${GITHUB_PROJECT:58}
github.assignee=${GITHUB_ASSIGNEE:thiagocaandrade}

# Mock mode
devreport.mock-mode=${MOCK_MODE:true}

# DeepSeek AI Configuration
spring.ai.openai.base-url=${AI_BASE_URL:https://api.deepseek.com}
spring.ai.openai.api-key=${AI_API_KEY}
spring.ai.openai.chat.options.model=${AI_MODEL:deepseek-chat}
spring.ai.openai.chat.options.temperature=${AI_TEMPERATURE:0.7}
